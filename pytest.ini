[pytest]
testpaths = project/tests
addopts = -q --strict-markers -m "not results"
markers =
    slow: end-to-end training loops (levels L8 and L9)
    results: assertions against results/runs.csv rather than against code.
        A categorically different layer from the rest of the suite: the unit
        tests prove the code does what it was written to do and would all pass
        on a method that has no effect. These protect the PAPER -- target
        attainment, scope consistency, protocol matching, provenance chaining.
        Skipped when no records exist. Run with: pytest -m results -s

# GradScaler(enabled=True) on a CPU-only box warns once and then self-disables,
# turning unscale_/step/update into no-op passthroughs. That is precisely why
# the mixed-precision path is locally testable at all; suppress the noise so
# test_optimizer_step_with_mixed_precision_on_cpu reads cleanly.
filterwarnings =
    ignore:.*GradScaler is enabled, but CUDA is not available.*:UserWarning
